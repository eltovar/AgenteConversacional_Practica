[pytest]
# asyncio_mode=auto — los tests del repo usan `async def` sin decorar con
# @pytest.mark.asyncio. Sin esta config pytest-asyncio no se activa y pytest
# reporta "async def functions are not natively supported" como FAILED, dando
# la falsa impresion de 13 tests rotos cuando en realidad nunca se ejecutaban.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests
python_files = test_*.py
python_functions = test_*

filterwarnings =
    ignore::DeprecationWarning
